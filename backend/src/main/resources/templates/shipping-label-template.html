<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Shipping Label</title>
    <style>
        body { font-family: 'Helvetica', Arial, sans-serif; font-size: 16px; margin: 0; padding: 20px; }
        .label-container { border: 2px solid #000; padding: 20px; width: 300px; height: 200px; }
        .to-header { font-weight: bold; margin-bottom: 10px; }
        .client-name { font-size: 20px; font-weight: bold; margin-bottom: 5px; }
        .client-address { margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="label-container">
        <div class="to-header">TO:</div>
        <div class="client-name" th:text="${client.name}">Client Name</div>
        <div class="client-address" th:text="${client.shippingAddress}">
            Shipping Address Line 1<br/>
            Shipping Address Line 2
        </div>
        <div><strong>State:</strong> <span th:text="${client.state}">State</span></div>
    </div>
</body>
</html>
